name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        neovim: ["0.10.4", "0.12.6"]
    env:
      MMD_TO_IMG_PUPPETEER_CONFIG: ${{ github.workspace }}/tests/puppeteer.json
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.2
      - name: Install the pinned renderer
        run: mise run //libs/MmdToImg:install
      - name: Install the Neovim version under test
        env:
          NEOVIM_VERSION: ${{ matrix.neovim }}
        run: |
          curl -fsSL "https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz" -o "$RUNNER_TEMP/neovim.tar.gz"
          tar -xzf "$RUNNER_TEMP/neovim.tar.gz" -C "$RUNNER_TEMP"
      - name: Check Lua formatting
        run: mise run //libs/MmdToImg:lint
      - name: Check Lua syntax
        run: |
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless -u NONE -l tests/syntax.lua
      - name: Test rendering and editor integration
        run: |
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless -u NONE -l tests/smoke.lua

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Plan the stable version with Premise
        id: plan
        uses: cloudvoyant/premise@v0.4.4
        with:
          command: plan
          flow: on-merge
          release: auto
          install-premise: pre-built
          premise-version: v0.4.4
      - name: Publish the version tag with Premise
        if: steps.plan.outputs.release_version != ''
        uses: cloudvoyant/premise@v0.4.4
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: release
          flow: on-merge
          release: none
          channel: stable
          version: ${{ steps.plan.outputs.release_version }}
          install-premise: skip
